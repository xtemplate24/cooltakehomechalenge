name: app1-backend-build

on:
  push:
    branches: [main]
    paths:
      - "apps/app1/backend/**"
      - ".github/workflows/app1-backend.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: app1-backend-build
      context: apps/app1/backend
      manifest: app-deployments/app1/backend/deployment.yaml
      
