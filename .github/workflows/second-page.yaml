name: second-page

on:
  push:
    branches: [main]
    paths:
      - "apps/second-page/**"
      - ".github/workflows/second-page.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: second-page
      context: apps/second-page
      manifest: app-deployments/second-page-app/deployment.yaml
      
