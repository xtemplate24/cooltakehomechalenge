name: build-image (reusable template)

on:
  workflow_call:
    inputs:
      name:
        description: Image name, published as ghcr.io/<owner>/<name>
        type: string
        required: true
      context:
        description: Folder containing the Dockerfile
        type: string
        required: true
      manifest:
        description: Kubernetes manifest whose image digest is updated after a push (optional)
        type: string
        required: false
        default: ""
    outputs:
      digest:
        description: Digest of the pushed image
        value: ${{ jobs.build.outputs.digest }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set image name (GHCR requires lowercase)
        env:
          NAME: ${{ inputs.name }}
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (load locally, do not push yet)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Scan with Trivy (fail on fixable HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ inputs.context }}
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      - name: Show pushed digest
        run: echo "Pushed ${IMAGE}@${{ steps.push.outputs.digest }}"

  update-manifest:
    needs: build
    if: inputs.manifest != '' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: update-manifest
      cancel-in-progress: false
    steps:
      - name: Checkout latest main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Write new digest into the manifest and commit
        env:
          NAME: ${{ inputs.name }}
          MANIFEST: ${{ inputs.manifest }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail

          # Only accept a well-formed digest
          if ! [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected digest format: $DIGEST" >&2
            exit 1
          fi

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${NAME}"
          sed -i -E "s#^( *image: )${IMAGE}(@sha256:[0-9a-f]{64})?\$#\1${IMAGE}@${DIGEST}#" "$MANIFEST"

          # Fail loudly if the image line was not found or not updated
          grep -q "${IMAGE}@${DIGEST}" "$MANIFEST"

          if git diff --quiet; then
            echo "Manifest already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MANIFEST"
          git commit -m "deploy: ${NAME} ${DIGEST} (from ${GITHUB_SHA::7})"
          git pull --rebase origin main
          git push origin HEAD:main
