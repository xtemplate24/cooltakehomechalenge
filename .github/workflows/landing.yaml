name: hello-nginx

on:
  push:
    branches: [main]
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: landing
      context: apps/landing
      manifest: app-deployments/landing/deployment.yaml
