name: hello-nginx

on:
  push:
    branches: [main]
    paths:
      - "apps/hello-nginx/**"
      - ".github/workflows/hello-nginx.yaml"
      - ".github/workflows/build-image.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yaml
    with:
      name: hello-nginx
      context: apps/hello-nginx
