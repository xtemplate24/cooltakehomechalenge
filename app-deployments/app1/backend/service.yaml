apiVersion: v1
kind: Service
metadata:
  name: app1-backend-svc
  namespace: app1
spec:
  # No "type" set = ClusterIP (default) — internal only.
  # There is deliberately no ingress.yaml pointing at this Service.
  selector:
    app: app1-backend
  ports:
    - name: api
      port: 8080
      targetPort: api