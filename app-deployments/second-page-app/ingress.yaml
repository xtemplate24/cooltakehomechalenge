apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: second-page-ingress
  namespace: second-page-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: >-
      auth-oauth2-proxy-errors@kubernetescrd,
      auth-oauth2-proxy-auth@kubernetescrd,
      second-page-app-strip-second@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - xtemplate.tail9d78f5.ts.net
  rules:
    - host: xtemplate.tail9d78f5.ts.net
      http:
        paths:
          - path: /second
            pathType: Prefix
            backend:
              service:
                name: second-page-app-svc
                port:
                  name: http