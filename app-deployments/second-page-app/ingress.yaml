apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: second-page-ingress
  namespace: second-page-app
spec:
  ingressClassName: traefik
  rules:
    - host: second.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: second-page-app-svc
                port:
                  name: http
