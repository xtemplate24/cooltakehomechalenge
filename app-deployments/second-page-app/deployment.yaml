apiVersion: apps/v1
kind: Deployment
metadata:
  name: second-page-app-deployment
  namespace: second-page-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: second-page-app-deployment
  template:
    metadata:
      labels:
        app: second-page-app-deployment
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/xtemplate24/second-page@sha256:744b71bb0290447d0b59e71ea2950465e85a9141bec5e90e933556d601a6037f
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: http }
          livenessProbe:
            httpGet: { path: /, port: http }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
