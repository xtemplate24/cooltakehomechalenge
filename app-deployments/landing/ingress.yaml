apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-ingress
  namespace: landing-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Intentionally no router.middlewares here — this is the one open path.
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - xtemplate.tail9d78f5.ts.net
  rules:
    - host: xtemplate.tail9d78f5.ts.net
      http:
        paths:
          # 1. Matches ONLY the landing homepage root
          - path: /
            pathType: Exact
            backend:
              service:
                name: landing-svc
                port:
                  name: http
          # 2. Matches and allows Vite compiled bundles (JS, CSS, images)
          - path: /assets
            pathType: Prefix
            backend:
              service:
                name: landing-svc
                port:
                  name: http
