apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-ingress
  namespace: landing-app
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Intentionally no router.middlewares here — this is the one open path.
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - xtemplate.tail9d78f5.ts.net
  rules:
    - host: xtemplate.tail9d78f5.ts.net
      http:
        paths:
          # Exact, not Prefix: matches only "/" so it can never
          # silently swallow a path that's missing its own Ingress.
          - path: /
            pathType: Exact
            backend:
              service:
                name: landing-svc
                port:
                  name: http